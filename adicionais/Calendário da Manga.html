<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Calendário da Mangueira</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg: #22362a;
  --bg-deep: #1a2b21;
  --surface: #f7f2e4;
  --surface-2: #efe8d4;
  --ink: #262319;
  --muted: #82795f;
  --accent: #e08a1e;
  --accent-ink: #4a2c05;
  --leaf: #c3d3a0;
  --line: #d9d0b4;
  --danger: #a8452f;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: var(--bg);
  background-image:
    radial-gradient(circle at 15% 10%, rgba(195,211,160,0.10), transparent 45%),
    radial-gradient(circle at 90% 85%, rgba(224,138,30,0.08), transparent 40%);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100vh;
  padding: clamp(16px, 4vw, 48px);
}

.page{ max-width: 1040px; margin: 0 auto; }

header{ margin-bottom: 28px; color: var(--surface); }
header .kicker{
  font-size: 13px;
  color: var(--leaf);
  margin: 0 0 6px 0;
  letter-spacing: 0.01em;
}
header h1{
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: clamp(28px, 4vw, 38px);
  margin: 0 0 8px 0;
  letter-spacing: -0.01em;
}
header p{
  margin: 0;
  color: #cdd6c6;
  font-size: 15px;
  max-width: 56ch;
  line-height: 1.5;
}

.layout{
  display: grid;
  grid-template-columns: 300px 1fr;
  gap: 20px;
  align-items: start;
}
@media (max-width: 760px){
  .layout{ grid-template-columns: 1fr; }
}

.card{
  background: var(--surface);
  border-radius: 6px;
  padding: 20px;
  box-shadow: 0 1px 0 rgba(0,0,0,0.15), 0 12px 30px rgba(0,0,0,0.18);
}

.card h2{
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 19px;
  margin: 0 0 14px 0;
}

.variety-row{
  border-top: 1px solid var(--line);
  padding: 12px 0;
}
.variety-row:first-of-type{ border-top: none; padding-top: 0; }

.variety-row .row-top{
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.variety-row .v-name{
  font-weight: 600;
  font-size: 15px;
}
.variety-row .v-total{
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.row-actions{
  margin-top: 6px;
  display: flex;
  gap: 14px;
}
.link-btn{
  background: none;
  border: none;
  padding: 0;
  font: inherit;
  font-size: 12.5px;
  color: var(--muted);
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.link-btn:hover{ color: var(--ink); }
.link-btn.danger:hover{ color: var(--danger); }

.field{ margin-bottom: 12px; }
.field label{
  display: block;
  font-size: 12.5px;
  color: var(--muted);
  margin-bottom: 5px;
}
.field input, .field select{
  width: 100%;
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: #fffdf8;
  font: inherit;
  font-size: 14px;
  color: var(--ink);
}
.field input:focus, .field select:focus{
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  border-color: var(--accent);
}
.field-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.btn{
  display: inline-block;
  border: none;
  border-radius: 4px;
  padding: 10px 16px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary{ background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover{ background: #c97914; }
.btn-secondary{
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
}
.btn-secondary:hover{ border-color: var(--ink); }
.btn-block{ width: 100%; }

.add-form{
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}

.new-variety-toggle{
  width: 100%;
  text-align: left;
  background: none;
  border: 1px dashed var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  font: inherit;
  font-size: 13.5px;
  color: var(--muted);
  cursor: pointer;
  margin-top: 14px;
}
.new-variety-toggle:hover{ border-color: var(--accent); color: var(--accent-ink); }

.calc-row{
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 12px;
  align-items: end;
}
@media (max-width: 560px){
  .calc-row{ grid-template-columns: 1fr; }
}

.timeline{
  margin-top: 26px;
  position: relative;
  padding-left: 26px;
}
.timeline::before{
  content: "";
  position: absolute;
  left: 6px;
  top: 6px;
  bottom: 6px;
  width: 1px;
  background: var(--line);
}
.stage{
  position: relative;
  padding-bottom: 22px;
}
.stage:last-child{ padding-bottom: 0; }
.stage::before{
  content: "";
  position: absolute;
  left: -26px;
  top: 3px;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--surface);
  border: 2px solid var(--muted);
}
.stage.is-target::before{
  border-color: var(--accent);
  background: var(--accent);
}
.stage .stage-name{
  font-weight: 600;
  font-size: 14.5px;
}
.stage .stage-date{
  font-family: 'Fraunces', serif;
  font-size: 20px;
  margin-top: 2px;
}
.stage.is-target .stage-date{ color: var(--accent-ink); }
.stage .stage-gap{
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}

.empty-note{
  color: var(--muted);
  font-size: 14px;
  padding: 8px 0 2px 0;
}

.helper{
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.sr-only{
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
</style>
</head>
<body>
<div class="page">

  <header>
    <p class="kicker">Vale do São Francisco</p>
    <h1>Calendário da mangueira</h1>
    <p>Escolha a variedade e a data desejada de colheita. O calendário calcula, contando os dias para trás, quando fazer a poda pós-colheita, aplicar o regulador de crescimento e induzir o florescimento.</p>
  </header>

  <div class="layout">

    <div class="card" id="sidebar">
      <h2>Variedades</h2>
      <div id="varietyList"></div>
      <button class="new-variety-toggle" id="toggleAddForm" type="button">+ Cadastrar nova variedade</button>

      <div class="add-form" id="addForm" style="display:none;">
        <div class="field">
          <label for="newName">Nome da variedade</label>
          <input type="text" id="newName" placeholder="Ex: Tommy Atkins">
        </div>
        <div class="field-grid">
          <div class="field">
            <label for="newP1">Poda → Regulador (dias)</label>
            <input type="number" id="newP1" min="0" value="0">
          </div>
          <div class="field">
            <label for="newP2">Regulador → Indução (dias)</label>
            <input type="number" id="newP2" min="0" value="0">
          </div>
          <div class="field">
            <label for="newP3">Indução → Florescimento (dias)</label>
            <input type="number" id="newP3" min="0" value="0">
          </div>
          <div class="field">
            <label for="newP4">Florescimento → Colheita (dias)</label>
            <input type="number" id="newP4" min="0" value="0">
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary" id="saveNewVariety" type="button">Salvar</button>
          <button class="btn btn-secondary" id="cancelNewVariety" type="button">Cancelar</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Calculadora</h2>
      <div class="calc-row">
        <div class="field" style="margin-bottom:0;">
          <label for="varietySelect">Variedade</label>
          <select id="varietySelect"></select>
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="harvestDate">Data desejada da colheita</label>
          <input type="date" id="harvestDate">
        </div>
        <button class="btn btn-primary" id="calcBtn" type="button">Calcular</button>
      </div>
      <div id="result"></div>
    </div>

  </div>
</div>

<script>
const STORAGE_KEY = 'varieties';
let varieties = [];
let editingId = null;

function uid(){ return 'v' + Math.random().toString(36).slice(2,10); }

async function loadVarieties(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      varieties = JSON.parse(res.value);
      return;
    }
  }catch(e){ /* key doesn't exist yet */ }
  varieties = [
    { id: uid(), name: 'Palmer', p1: 60, p2: 90, p3: 30, p4: 140 }
  ];
  await persist();
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify(varieties), false);
  }catch(e){
    console.error('Falha ao salvar variedades', e);
  }
}

function total(v){ return v.p1 + v.p2 + v.p3 + v.p4; }

function renderVarietyList(){
  const list = document.getElementById('varietyList');
  list.innerHTML = '';
  if(varieties.length === 0){
    list.innerHTML = '<p class="empty-note">Nenhuma variedade cadastrada ainda.</p>';
    return;
  }
  varieties.forEach(v => {
    const row = document.createElement('div');
    row.className = 'variety-row';

    if(editingId === v.id){
      row.innerHTML = `
        <div class="field">
          <label>Nome da variedade</label>
          <input type="text" class="edit-name" value="${escapeAttr(v.name)}">
        </div>
        <div class="field-grid">
          <div class="field">
            <label>Poda → Regulador (dias)</label>
            <input type="number" min="0" class="edit-p1" value="${v.p1}">
          </div>
          <div class="field">
            <label>Regulador → Indução (dias)</label>
            <input type="number" min="0" class="edit-p2" value="${v.p2}">
          </div>
          <div class="field">
            <label>Indução → Florescimento (dias)</label>
            <input type="number" min="0" class="edit-p3" value="${v.p3}">
          </div>
          <div class="field">
            <label>Florescimento → Colheita (dias)</label>
            <input type="number" min="0" class="edit-p4" value="${v.p4}">
          </div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary save-edit" type="button">Salvar</button>
          <button class="btn btn-secondary cancel-edit" type="button">Cancelar</button>
        </div>
      `;
      row.querySelector('.save-edit').addEventListener('click', () => saveEdit(v.id, row));
      row.querySelector('.cancel-edit').addEventListener('click', () => { editingId = null; renderVarietyList(); });
    } else {
      row.innerHTML = `
        <div class="row-top">
          <span class="v-name">${escapeHtml(v.name)}</span>
          <span class="v-total">${total(v)} dias no ciclo</span>
        </div>
        <div class="row-actions">
          <button class="link-btn edit-btn" type="button">Editar</button>
          <button class="link-btn danger remove-btn" type="button">Remover</button>
        </div>
      `;
      row.querySelector('.edit-btn').addEventListener('click', () => { editingId = v.id; renderVarietyList(); });
      row.querySelector('.remove-btn').addEventListener('click', () => removeVariety(v.id, row));
    }

    list.appendChild(row);
  });
}

function saveEdit(id, row){
  const name = row.querySelector('.edit-name').value.trim();
  if(!name) return;
  const p1 = Math.max(0, parseInt(row.querySelector('.edit-p1').value) || 0);
  const p2 = Math.max(0, parseInt(row.querySelector('.edit-p2').value) || 0);
  const p3 = Math.max(0, parseInt(row.querySelector('.edit-p3').value) || 0);
  const p4 = Math.max(0, parseInt(row.querySelector('.edit-p4').value) || 0);
  const v = varieties.find(x => x.id === id);
  v.name = name; v.p1 = p1; v.p2 = p2; v.p3 = p3; v.p4 = p4;
  editingId = null;
  persist();
  renderVarietyList();
  renderVarietySelect();
  updateResultIfSameVariety(id);
}

let removeArmed = null;
function removeVariety(id, row){
  if(removeArmed !== id){
    removeArmed = id;
    const btn = row.querySelector('.remove-btn');
    btn.textContent = 'Confirmar remoção';
    setTimeout(() => { if(removeArmed === id){ removeArmed = null; if(btn.isConnected) btn.textContent = 'Remover'; } }, 3000);
    return;
  }
  varieties = varieties.filter(v => v.id !== id);
  removeArmed = null;
  persist();
  renderVarietyList();
  renderVarietySelect();
}

function renderVarietySelect(){
  const sel = document.getElementById('varietySelect');
  const prev = sel.value;
  sel.innerHTML = '';
  if(varieties.length === 0){
    sel.innerHTML = '<option value="">Cadastre uma variedade</option>';
    return;
  }
  varieties.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.id;
    opt.textContent = v.name;
    sel.appendChild(opt);
  });
  if(varieties.some(v => v.id === prev)) sel.value = prev;
}

function escapeHtml(str){
  return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(str){ return escapeHtml(str); }

function parseDateInput(str){
  const [y,m,d] = str.split('-').map(Number);
  return new Date(Date.UTC(y, m-1, d));
}
function addDays(date, days){
  const d = new Date(date.getTime());
  d.setUTCDate(d.getUTCDate() + days);
  return d;
}
function formatBR(date){
  const d = String(date.getUTCDate()).padStart(2,'0');
  const m = String(date.getUTCMonth()+1).padStart(2,'0');
  const y = date.getUTCFullYear();
  return `${d}/${m}/${y}`;
}

function calculate(){
  const sel = document.getElementById('varietySelect');
  const dateInput = document.getElementById('harvestDate');
  const resultDiv = document.getElementById('result');

  const v = varieties.find(x => x.id === sel.value);
  if(!v){
    resultDiv.innerHTML = '<p class="empty-note">Cadastre uma variedade para começar.</p>';
    return;
  }
  if(!dateInput.value){
    resultDiv.innerHTML = '<p class="empty-note">Escolha a data desejada da colheita.</p>';
    return;
  }

  const colheita = parseDateInput(dateInput.value);
  const florescimento = addDays(colheita, -v.p4);
  const inducao = addDays(florescimento, -v.p3);
  const regulador = addDays(inducao, -v.p2);
  const poda = addDays(regulador, -v.p1);

  const stages = [
    { name: 'Poda pós-colheita', date: poda, gap: null, target: false },
    { name: 'Regulador de crescimento', date: regulador, gap: v.p1, target: false },
    { name: 'Indução floral', date: inducao, gap: v.p2, target: false },
    { name: 'Florescimento', date: florescimento, gap: v.p3, target: false },
    { name: 'Colheita', date: colheita, gap: v.p4, target: true }
  ];

  resultDiv.innerHTML = `
    <div class="timeline">
      ${stages.map(s => `
        <div class="stage ${s.target ? 'is-target' : ''}">
          <div class="stage-name">${s.name}</div>
          <div class="stage-date">${formatBR(s.date)}</div>
          ${s.gap !== null ? `<div class="stage-gap">${s.gap} dias após a etapa anterior</div>` : ''}
        </div>
      `).join('')}
    </div>
    <p class="helper">Ciclo total: ${total(v)} dias, da poda pós-colheita até a colheita.</p>
  `;
}

function updateResultIfSameVariety(id){
  const sel = document.getElementById('varietySelect');
  if(sel.value === id && document.getElementById('harvestDate').value){
    calculate();
  }
}

document.getElementById('toggleAddForm').addEventListener('click', () => {
  const form = document.getElementById('addForm');
  form.style.display = form.style.display === 'none' ? 'block' : 'none';
});
document.getElementById('cancelNewVariety').addEventListener('click', () => {
  document.getElementById('addForm').style.display = 'none';
});
document.getElementById('saveNewVariety').addEventListener('click', () => {
  const name = document.getElementById('newName').value.trim();
  if(!name) return;
  const p1 = Math.max(0, parseInt(document.getElementById('newP1').value) || 0);
  const p2 = Math.max(0, parseInt(document.getElementById('newP2').value) || 0);
  const p3 = Math.max(0, parseInt(document.getElementById('newP3').value) || 0);
  const p4 = Math.max(0, parseInt(document.getElementById('newP4').value) || 0);
  varieties.push({ id: uid(), name, p1, p2, p3, p4 });
  persist();
  renderVarietyList();
  renderVarietySelect();
  document.getElementById('newName').value = '';
  document.getElementById('newP1').value = 0;
  document.getElementById('newP2').value = 0;
  document.getElementById('newP3').value = 0;
  document.getElementById('newP4').value = 0;
  document.getElementById('addForm').style.display = 'none';
});
document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('varietySelect').addEventListener('change', calculate);
document.getElementById('harvestDate').addEventListener('change', calculate);

(async function init(){
  await loadVarieties();
  renderVarietyList();
  renderVarietySelect();
})();
</script>
</body>
</html>
